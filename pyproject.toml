[project]
name = "pc-hardware-tracker"
version = "0.1.0"
description = "电脑硬件价格跟踪大盘：关注、走势、预测与 DeepSeek 分析"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "apscheduler>=3.10.4",
  "python-dotenv>=1.0.1",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
